name: Windows Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip  
          if exist requirements.txt (  
            python -m pip install -r requirements.txt  
          ) else (  
            echo No requirements.txt found, skipping  
          )  

      - name: Install PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pyinstaller  

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --onefile --clean --icon icons/app_icon.ico batch_rename.py  

      - name: Rename output to 批量修改文件名.exe
        shell: cmd
        run: |
          if exist dist (\   
            ren dist\batch_rename.exe "批量修改文件名.exe" \
          ) else (  
            echo "dist/batch_rename.exe not found"  
          )