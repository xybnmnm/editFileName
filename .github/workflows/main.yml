name: Windows Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  
          if exist requirements.txt (  
            pip install -r requirements.txt  
          )  
          else (  
            echo "No requirements.txt found, skipping"  
          )  

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pyinstaller  

      - name: Build executable
        run: |
          # 根据你的项目实际情况修改命令  
          # 示例：打包 main.py，若有数据需要 add-data，请按下面的示例添加  
          pyinstaller --onefile --clean batch_rename.py  
          # 如需添加数据，示例：  
          # pyinstaller --onefile --clean --add-data "C:\path\data;data" batch_rename.py
        # env:
        # 如果你的打包需要某些环境变量，可以在这里设置
        # 例如 DATA_PATH: data
        #

      - name: List artifacts
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/*.exe

      - name: Create Release (optional)
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload to Release (optional)
        if: github.event_name == 'push'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/*.exe
          asset_name: batch_rename.exe
          asset_label: 'Windows executable'  
